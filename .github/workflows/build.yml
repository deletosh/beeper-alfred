name: Build Workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build Alfred Workflow
    runs-on: macos-latest

    # The PR-comment step posts an issue comment, which the default read-only
    # GITHUB_TOKEN cannot do (403 "Resource not accessible by integration").
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get version and commit info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_name=beeper-alfred-${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Generate icons
        run: npm run generate-icons || echo "Icon generation skipped (optional)"
        continue-on-error: true

      - name: Build workflow package
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail

          # `[ ! -f dist/*.alfredworkflow ]` breaks when the glob expands, so
          # count matches instead of testing the pattern directly.
          shopt -s nullglob
          builds=(dist/*.alfredworkflow)
          if [ ${#builds[@]} -eq 0 ]; then
            echo "❌ Build failed - no .alfredworkflow file found"
            exit 1
          fi
          WORKFLOW="${builds[0]}"
          echo "✅ Built $WORKFLOW"
          ls -lh dist/

          # The archive is what users actually install, so assert its contents
          # rather than trusting that the build script did the right thing.
          echo "--- verifying archive contents ---"
          for required in info.plist src/index.js src/api/oauth.js src/utils/tokenStore.js; do
            unzip -l "$WORKFLOW" | grep -q " $required$" \
              || { echo "❌ missing $required"; exit 1; }
            echo "  ✓ $required"
          done

          # The workflow runs with no install step on the user's machine, so a
          # bundled node_modules would mean a runtime dependency crept back in.
          if unzip -l "$WORKFLOW" | grep -q "node_modules/"; then
            echo "❌ node_modules bundled - the workflow must stay dependency-free"
            exit 1
          fi
          echo "  ✓ no node_modules"

          if unzip -l "$WORKFLOW" | grep -qE "__tests__|\.test\.js"; then
            echo "❌ tests bundled into the release artifact"
            exit 1
          fi
          echo "  ✓ no tests"

      - name: Verify the dead /v0 SDK has not returned
        run: |
          set -euo pipefail

          # Current Beeper builds 404 every /v0/* route; the @beeper/desktop-api
          # SDK only speaks /v0. Reintroducing either breaks every command.
          if grep -rn "@beeper/desktop-api" src --include='*.js' | grep -v '^\s*\*' | grep -v ' \* '; then
            echo "❌ SDK reference found in src/ - use client.v1() instead"
            exit 1
          fi
          if grep -rn "'/v0/\|\"/v0/" src --include='*.js'; then
            echo "❌ /v0/ route found in src/ - current builds return 404"
            exit 1
          fi
          if node -e "process.exit(Object.keys(require('./package.json').dependencies || {}).length ? 1 : 0)"; then
            echo "✅ no runtime dependencies, no /v0 usage"
          else
            echo "❌ package.json gained a runtime dependency"
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.build_name }}
          path: dist/*.alfredworkflow
          retention-days: 90

      - name: Upload latest build (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: beeper-alfred-latest
          path: dist/*.alfredworkflow
          retention-days: 90

      # Convenience only — a failure to comment must not fail a good build
      # (e.g. PRs from forks, where the token is read-only regardless).
      - name: Comment download link on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runId = context.runId;
            const repo = context.repo;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: repo.owner,
              repo: repo.repo,
              body: `## 📦 Build Successful!

            Your Alfred workflow has been built and is ready to test.

            **Download this build:**
            [beeper-alfred-${{ steps.version.outputs.build_name }}.alfredworkflow](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId})

            ### How to test:
            1. Go to the link above
            2. Scroll to "Artifacts" section at the bottom
            3. Download the workflow file
            4. Double-click to install in Alfred
            5. Run \`bp setup\` to configure

            ---
            Built from commit \`${{ steps.version.outputs.short_sha }}\``
            })

  build-info:
    name: Build Information
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Display download instructions
        run: |
          echo "✅ Build complete!"
          echo ""
          echo "📦 Latest build is available as an artifact in this workflow run"
          echo "🔗 Direct link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "To download:"
          echo "1. Visit the link above"
          echo "2. Scroll to 'Artifacts' section"
          echo "3. Download 'beeper-alfred-latest'"
