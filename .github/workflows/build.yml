name: Build Workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build Alfred Workflow
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get version and commit info
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_name=beeper-alfred-${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Generate icons
        run: npm run generate-icons || echo "Icon generation skipped (optional)"
        continue-on-error: true

      - name: Build workflow package
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/*.alfredworkflow ]; then
            echo "❌ Build failed - no .alfredworkflow file found"
            exit 1
          fi
          echo "✅ Build successful"
          ls -lh dist/

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.build_name }}
          path: dist/*.alfredworkflow
          retention-days: 90

      - name: Upload latest build (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: beeper-alfred-latest
          path: dist/*.alfredworkflow
          retention-days: 90

      - name: Comment download link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runId = context.runId;
            const repo = context.repo;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: repo.owner,
              repo: repo.repo,
              body: `## 📦 Build Successful!

            Your Alfred workflow has been built and is ready to test.

            **Download this build:**
            [beeper-alfred-${{ steps.version.outputs.build_name }}.alfredworkflow](https://github.com/${repo.owner}/${repo.repo}/actions/runs/${runId})

            ### How to test:
            1. Go to the link above
            2. Scroll to "Artifacts" section at the bottom
            3. Download the workflow file
            4. Double-click to install in Alfred
            5. Run \`bp setup\` to configure

            ---
            Built from commit \`${{ steps.version.outputs.short_sha }}\``
            })

  build-info:
    name: Build Information
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Display download instructions
        run: |
          echo "✅ Build complete!"
          echo ""
          echo "📦 Latest build is available as an artifact in this workflow run"
          echo "🔗 Direct link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "To download:"
          echo "1. Visit the link above"
          echo "2. Scroll to 'Artifacts' section"
          echo "3. Download 'beeper-alfred-latest'"
