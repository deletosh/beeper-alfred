name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Alfred Workflow
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # NOT --production: the workflow ships zero runtime dependencies, so
      # that flag installs nothing and the build fails on a missing archiver,
      # which is a devDependency.
      - name: Install dependencies
        run: npm ci

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # --allow-same-version: releasing a tag that matches the version already
      # in package.json is normal, and npm version exits 1 on "not changed",
      # which would abort the release.
      - name: Update version in package.json
        run: |
          npm version ${{ steps.get_version.outputs.version }} \
            --no-git-tag-version --allow-same-version

      - name: Generate icons
        run: npm run generate-icons || echo "Icon generation skipped (optional)"
        continue-on-error: true

      - name: Build workflow package
        run: npm run build

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: beeper-alfred-${{ steps.get_version.outputs.version }}
          path: dist/*.alfredworkflow
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Full history and tags: the changelog step runs git describe/git log,
      # which produce nothing under the default depth-1 shallow checkout.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: beeper-alfred-${{ steps.get_version.outputs.version }}
          path: dist

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          VERSION="v${{ steps.get_version.outputs.version }}"

          {
            echo "## What's Changed"
            echo ""
          } > changelog.md

          # Previous tag excluding this release's own tag. On a first release
          # there is none, so list the full history instead of an empty range.
          LAST_TAG=$(git tag --sort=-creatordate | grep -v "^${VERSION}$" | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"* %s (%h)" >> changelog.md
          else
            git log "${LAST_TAG}..HEAD" --pretty=format:"* %s (%h)" >> changelog.md
          fi

          {
            echo ""
            echo ""
            echo "## Installation"
            echo ""
            echo "1. Download \`beeper-alfred.alfredworkflow\` below"
            echo "2. Double-click it to install in Alfred"
            echo "3. Run \`bp setup\` in Alfred and press ↵ on \"Connect Alfred to Beeper\""
            echo ""
            echo "Authorization uses OAuth — Beeper opens a consent page in your"
            echo "browser. There is no token to copy or paste."
            echo ""
            echo "**Requires:** Alfred 5 with Powerpack, Node.js 20+, Beeper Desktop"
          } >> changelog.md

          # A compare link needs two refs; on a first release there is only one.
          if [ -n "$LAST_TAG" ]; then
            echo "" >> changelog.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${VERSION}" >> changelog.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          body_path: changelog.md
          files: dist/*.alfredworkflow
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Post-Release Notification
    needs: release
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Success notification
        run: |
          echo "✅ Release v${{ steps.get_version.outputs.version }} published successfully!"
          echo "📦 Download: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.get_version.outputs.version }}"
